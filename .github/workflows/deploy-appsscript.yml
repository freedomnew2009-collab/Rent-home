name: Deploy to Apps Script

# อัปเดตโค้ดขึ้น Google Apps Script อัตโนมัติเมื่อไฟล์ใน src/ เปลี่ยน
# เรียก Apps Script API ตรง ๆ (ไม่ผ่าน clasp) จึงไม่ผูกกับเวอร์ชัน/รูปแบบไฟล์ของ clasp
#
# ต้องตั้ง Secrets ที่: Settings → Secrets and variables → Actions → New repository secret
#   CLASPRC_JSON  (จำเป็น) เนื้อหาไฟล์ ~/.clasprc.json จากเครื่องที่ `clasp login` แล้ว
#   SCRIPT_ID     (จำเป็น) Apps Script → ⚙️ Project Settings → Script ID
#   DEPLOYMENT_ID (แนะนำ) Deploy → Manage deployments → Deployment ID
#                 ถ้าใส่ไว้ ระบบจะสร้างเวอร์ชันใหม่บน URL เดิมให้อัตโนมัติ

on:
  push:
    branches: ['**']
    paths:
      - 'src/**'
      - '.github/workflows/deploy-appsscript.yml'
      - '.github/scripts/deploy-appsscript.js'
  workflow_dispatch:

concurrency:
  group: appsscript-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ตรวจไวยากรณ์ไฟล์ใน src/ ก่อนอัปโหลด
        run: |
          set -euo pipefail
          cp src/Code.gs /tmp/Code.check.js
          node --check /tmp/Code.check.js
          node -e '
            const fs = require("fs");
            const html = fs.readFileSync("src/Index.html", "utf8");
            const blocks = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!blocks.length) throw new Error("ไม่พบ <script> ใน Index.html");
            blocks.forEach((b, i) => fs.writeFileSync(`/tmp/idx_${i}.js`, b));
            console.log(`พบสคริปต์ ${blocks.length} บล็อก`);
          '
          for f in /tmp/idx_*.js; do node --check "$f"; done
          node -e 'JSON.parse(require("fs").readFileSync("src/appsscript.json","utf8"))'
          echo "✓ ไฟล์ทั้งหมดผ่านการตรวจ"

      - name: ตรวจว่าตั้ง Secrets ครบ
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${CLASPRC_JSON:-}" ] || { echo "::error::ยังไม่ได้ตั้ง secret CLASPRC_JSON"; missing=1; }
          [ -n "${SCRIPT_ID:-}" ] || { echo "::error::ยังไม่ได้ตั้ง secret SCRIPT_ID"; missing=1; }
          [ -n "${DEPLOYMENT_ID:-}" ] || echo "::warning::ไม่ได้ตั้ง DEPLOYMENT_ID — จะอัปโหลดโค้ดอย่างเดียว"
          [ "$missing" -eq 0 ] || exit 1
          echo "✓ Secrets พร้อมใช้งาน"

      - name: อัปโหลดขึ้น Apps Script และสร้างเวอร์ชันใหม่
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          VERSION_NOTE: 'auto ${{ github.sha }}'
        run: node .github/scripts/deploy-appsscript.js
