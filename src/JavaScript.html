<script>
(function () {
  /* ---------- helpers ---------- */
  var ICONS = (window.__ICONS && window.__ICONS.phosphor) || {};
  function ICON(k) { return ICONS[k] || ''; }
  function q(s, r) { return (r || document).querySelector(s); }
  function qa(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function up(t, sel) { t = (t && t.nodeType === 1) ? t : (t && t.parentElement); return t ? t.closest(sel) : null; }
  function setText(sel, v) { var e = q(sel); if (e) e.textContent = v; }
  function paintIcons(root) { qa('[data-ic]', root).forEach(function (el) { el.innerHTML = ICON(el.getAttribute('data-ic')); }); }
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function money(n) { n = Number(n) || 0; return '฿' + Math.round(n).toLocaleString('th-TH'); }
  function isUrl(s) { return s && /^https?:\/\//.test(String(s)); }
  function toThaiDate(iso) { var p = String(iso).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function toISODate(th) { var p = String(th).split('/'); if (p.length !== 3) return ''; var y = p[2]; if (y.length !== 4) return ''; return y + '-' + p[1].padStart(2,'0') + '-' + p[0].padStart(2,'0'); }

  // google.script.run -> Promise
  function srun(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name].apply(null, args);
    });
  }

  /* ---------- state ---------- */
  var CATS = [];            // จาก getCategories()
  var CATMAP = {};
  var DASH = null;          // dashboard เดือนปัจจุบัน
  var OFFSET = 0;
  var recordFile = null;    // {name, mimeType, data}

  var STAT = {
    paid:             { cls: 'stat paid',     ic: 'check',     label: 'จัดสรรแล้ว' },
    waiting_slip:     { cls: 'stat slip',     ic: 'paperclip', label: 'รอสลิป' },
    waiting_transfer: { cls: 'stat transfer', ic: 'arrow',     label: 'รอโอน' },
    overdue:          { cls: 'stat overdue',  ic: 'warning',   label: 'เกินกำหนด' },
    none:             { cls: 'stat paid',     ic: '',          label: 'ยังไม่ตั้ง' }
  };
  function statHTML(st) {
    var s = STAT[st] || STAT.waiting_transfer;
    var icon = s.ic ? '<span class="ic" data-ic="' + s.ic + '"></span>' : '';
    return '<span class="' + s.cls + '">' + icon + s.label + '</span>';
  }
  function actHTML(a) {
    if (a.status === 'paid') {
      if (isUrl(a.slip)) return '<button class="act link" data-open-slip="' + esc(a.slip) + '"><span class="ic" data-ic="external"></span>ดูสลิป</button>';
      return '<button class="act link" data-open-record="' + a.key + '"><span class="ic" data-ic="check"></span>แก้ไข</button>';
    }
    if (a.status === 'waiting_slip') return '<button class="act outline" data-open-record="' + a.key + '"><span class="ic" data-ic="paperclip"></span>แนบสลิป</button>';
    if (a.status === 'overdue')      return '<button class="act danger" data-open-record="' + a.key + '"><span class="ic" data-ic="warning"></span>โอนด่วน</button>';
    if (a.status === 'none')         return '<button class="act outline" data-open-record="' + a.key + '"><span class="ic" data-ic="add"></span>บันทึก</button>';
    return '<button class="act primary" data-open-record="' + a.key + '"><span class="ic" data-ic="arrow"></span>โอนเลย</button>';
  }

  /* ---------- dashboard ---------- */
  function loadDashboard(offset) {
    OFFSET = offset || 0;
    var led = q('[data-ledger]'); if (led) led.innerHTML = '<div class="empty-note">กำลังโหลด…</div>';
    srun('getDashboard', OFFSET).then(renderDashboard).catch(function (e) { toast('โหลดข้อมูลไม่สำเร็จ: ' + e.message, 1); });
  }

  function renderDashboard(d) {
    DASH = d;
    if (!d || !d.hasData) {
      setText('[data-month-label]', '—'); setText('[data-issue]', 'ฉบับรายเดือน');
      setText('[data-income]', '฿0'); setText('[data-income-eyebrow]', 'ค่าเช่ารับเข้า');
      q('[data-income-meta]').innerHTML = '<span style="font-style:italic">ยังไม่มีข้อมูล — เริ่มที่ปุ่ม “บันทึก”</span>';
      q('[data-bar]').innerHTML = '<span class="seg leftover" style="flex:1 1 0"></span>';
      setText('[data-alloc-pct]', '0% จัดสรรแล้ว'); setText('[data-sum-allocated]', '฿0'); setText('[data-sum-pending]', '฿0'); setText('[data-sum-leftover]', '฿0');
      q('[data-alert]').classList.add('hide');
      q('[data-ledger]').innerHTML = '<div class="empty-note">ยังไม่มีรายการ</div>';
      return;
    }
    OFFSET = d.offset;
    setText('[data-month-label]', d.monthLabel || '—');
    setText('[data-issue]', d.monthLabel ? ('ฉบับ ' + d.monthLabel) : 'ฉบับรายเดือน');

    // income lead
    setText('[data-income]', money(d.income));
    setText('[data-income-eyebrow]', 'ค่าเช่ารับเข้า' + (d.incomeDate ? ' · ' + d.incomeDate : ''));
    var meta = q('[data-income-meta]');
    if (isUrl(d.incomeSlip)) meta.innerHTML = '<span class="received link" data-open-slip="' + esc(d.incomeSlip) + '"><span class="ic" data-ic="check"></span>รับเข้าแล้ว · ดูสลิป</span>';
    else if (d.income > 0) meta.innerHTML = '<span class="received"><span class="ic" data-ic="check"></span>บันทึกค่าเช่าแล้ว</span>';
    else meta.innerHTML = '<span style="font-style:italic">ยังไม่บันทึกค่าเช่าเดือนนี้</span>';
    paintIcons(meta);

    // totals
    var total = 0, allocated = 0, pending = 0;
    var pendItems = [];
    d.allocations.forEach(function (a) {
      total += a.amount;
      if (a.status === 'paid' || a.status === 'waiting_slip') allocated += a.amount;
      else if (a.status === 'waiting_transfer' || a.status === 'overdue') { pending += a.amount; pendItems.push(a); }
      // status 'none' (ยังไม่ตั้ง) — ไม่นับเป็นจัดสรร/รอจัดสรร
    });
    var leftover = d.income - total;

    // bar
    var segs = '';
    d.allocations.forEach(function (a) {
      if (a.amount <= 0) return;
      var pend = !(a.status === 'paid' || a.status === 'waiting_slip');
      segs += '<span class="seg' + (pend ? ' pending' : '') + '" style="flex:' + a.amount + ' 1 0; background:' + a.color + '"></span>';
    });
    if (leftover > 0) segs += '<span class="seg leftover" style="flex:' + leftover + ' 1 0"></span>';
    q('[data-bar]').innerHTML = segs || '<span class="seg leftover" style="flex:1 1 0"></span>';

    setText('[data-alloc-pct]', (total ? Math.round(allocated / total * 100) : 0) + '% จัดสรรแล้ว');
    setText('[data-sum-allocated]', money(allocated));
    setText('[data-sum-pending]', money(pending));
    setText('[data-sum-leftover]', (leftover < 0 ? '−' : '') + '฿' + Math.abs(Math.round(leftover)).toLocaleString('th-TH'));

    // alert (รายการที่ยังรอโอน)
    var al = q('[data-alert]');
    if (pendItems.length) {
      al.classList.remove('hide');
      q('.a-body', al).innerHTML = '<b>ยังรอจัดสรร ' + pendItems.length + ' รายการ</b> — ' +
        pendItems.map(function (p) { return esc(p.name); }).join(' · ') + ' · แตะเพื่อบันทึกการโอน';
      paintIcons(al);
    } else { al.classList.add('hide'); }

    // ledger
    q('[data-ledger]').innerHTML = d.allocations.map(entryHTML).join('');
    paintIcons(q('[data-ledger]'));
  }

  function entryHTML(a) {
    return '<div class="entry" data-task="' + a.key + '" data-status="' + a.status + '">' +
      '<div class="top"><div class="e-name"><span class="dot" style="background:' + a.color + '"></span>' + esc(a.name) + '</div>' +
      '<div class="e-amt">' + (a.amount > 0 ? money(a.amount) : '—') + '</div></div>' +
      '<div class="bottom"><div class="e-dest">โอนไป <span class="to">' + esc(a.dest) + '</span>' + (a.date ? ' · ' + esc(a.date) : '') + '</div>' +
      '<div class="e-side"><span>' + statHTML(a.status) + '</span><span>' + actHTML(a) + '</span></div></div></div>';
  }

  /* ---------- record form ---------- */
  function buildCatSelect() {
    var sel = q('[data-cat-select]');
    sel.innerHTML = CATS.map(function (c) { return '<option value="' + c.key + '">' + esc(c.name) + '</option>'; }).join('');
    updateDest();
  }
  function updateDest() {
    var sel = q('[data-cat-select]'); var c = CATMAP[sel.value];
    setText('[data-dest-name]', c ? c.dest : '—');
  }
  function openRecord(catKey) {
    switchPanel('record');
    var sel = q('[data-cat-select]'); if (catKey && CATMAP[catKey]) sel.value = catKey;
    updateDest();
    // เติมงวดจากเดือนที่กำลังดู + จำนวนเดิม (ถ้ามี)
    if (DASH && DASH.installment) q('[data-f="installment"]').value = DASH.installment;
    var alloc = DASH && DASH.allocations ? DASH.allocations.filter(function (a) { return a.key === catKey; })[0] : null;
    if (catKey === 'rent' && DASH) { q('[data-f="amount"]').value = DASH.income || ''; if (DASH.incomeDate) q('[data-f="date"]').value = toISODate(DASH.incomeDate); }
    else if (alloc) { q('[data-f="amount"]').value = alloc.amount || ''; if (alloc.date) q('[data-f="date"]').value = toISODate(alloc.date); }
    var amt = q('[data-f="amount"]'); if (amt) amt.focus();
  }
  function resetRecord() {
    q('[data-f="amount"]').value = ''; q('[data-f="date"]').value = ''; q('[data-f="installment"]').value = '';
    clearFile();
    if (CATS.length) q('[data-cat-select]').value = CATS[0].key;
    updateDest();
  }
  function clearFile() {
    recordFile = null;
    var inp = q('[data-file-input]'); if (inp) inp.value = '';
    var pv = q('[data-file-preview]'); if (pv) { pv.innerHTML = ''; pv.style.display = 'none'; }
    setText('[data-drop-name]', 'ถ่าย / เลือกรูปสลิป');
  }
  function guessMime(name) {
    var n = String(name || '').toLowerCase();
    if (/\.png$/.test(n)) return 'image/png';
    if (/\.webp$/.test(n)) return 'image/webp';
    if (/\.hei[cf]$/.test(n)) return 'image/heic';
    if (/\.gif$/.test(n)) return 'image/gif';
    return 'image/jpeg';
  }
  function submitRecord() {
    var cat = q('[data-cat-select]').value;
    var amount = q('[data-f="amount"]').value;
    var dateIso = q('[data-f="date"]').value;
    var installment = q('[data-f="installment"]').value.trim();
    if (!amount && !dateIso && !recordFile) { toast('กรอกจำนวนเงิน วันที่ หรือแนบสลิปอย่างน้อย 1 อย่าง', 1); return; }

    var payload = {
      category: cat,
      amount: amount === '' ? '' : Number(amount),
      date: dateIso ? toThaiDate(dateIso) : '',
      installment: installment,
      slip: recordFile || null
    };
    // ถ้างวดตรงกับเดือนที่กำลังดู ให้เขียนทับแถวเดิม
    if (DASH && installment && installment === (DASH.installment || '')) payload.row = DASH.row;

    overlay(true, recordFile ? 'กำลังบันทึก & อัปโหลดสลิป…' : 'กำลังบันทึก…');
    srun('saveAllocation', payload).then(function (res) {
      overlay(false);
      if (res && res.ok) {
        toast('บันทึกลง Google Sheet เรียบร้อย ✓');
        resetRecord();
        loadDashboard(0);
        switchPanel('dashboard');
      } else { toast('บันทึกไม่สำเร็จ: ' + ((res && res.error) || 'ไม่ทราบสาเหตุ'), 1); }
    }).catch(function (e) { overlay(false); toast('เกิดข้อผิดพลาด: ' + e.message, 1); });
  }

  /* ---------- history ---------- */
  function loadHistory() {
    var box = q('[data-history]'); box.innerHTML = '<div class="empty-note">กำลังโหลด…</div>';
    srun('getRecords').then(function (recs) {
      if (!recs || !recs.length) { box.innerHTML = '<div class="empty-note">ยังไม่มีรายการ</div>'; return; }
      box.innerHTML = recs.map(histMonthHTML).join('');
      paintIcons(box);
    }).catch(function (e) { box.innerHTML = '<div class="empty-note">โหลดไม่สำเร็จ: ' + esc(e.message) + '</div>'; });
  }
  function histMonthHTML(r) {
    var title = r.installment || (r.rentDate || 'รายการ');
    var lines = [];
    CATS.forEach(function (c) {
      if (c.income) return;
      var amt = num(r[c.amtKey]); var date = r[c.dateKey]; var slip = c.hasSlip ? r[c.slipKey] : '';
      if (!amt && !date && !isUrl(slip)) return;
      var right = (amt ? money(amt) : '—') + (date ? ' · ' + esc(date) : '') + (isUrl(slip) ? ' · <a href="' + esc(slip) + '" target="_blank" rel="noopener">ดูสลิป</a>' : '');
      lines.push('<div class="hm-line"><span>' + esc(c.name) + '</span><span class="v">' + right + '</span></div>');
    });
    return '<div class="hist-month"><div class="hm-top"><span class="hm-title">' + esc(title) + '</span>' +
      '<span class="hm-income">รับเข้า ' + money(num(r.rentAmount)) + '</span></div>' +
      '<div class="hm-lines">' + (lines.join('') || '<div class="hm-line"><span>— ไม่มีรายการจัดสรร —</span><span></span></div>') + '</div></div>';
  }

  /* ---------- summary ---------- */
  function loadSummary() {
    var box = q('[data-summary]'); box.innerHTML = '<div class="empty-note">กำลังโหลด…</div>';
    srun('getRecords').then(function (recs) {
      if (!recs || !recs.length) { box.innerHTML = '<div class="empty-note">ยังไม่มีข้อมูล</div>'; return; }
      var income = 0, totals = {}; CATS.forEach(function (c) { totals[c.key] = 0; });
      recs.forEach(function (r) {
        income += num(r.rentAmount);
        CATS.forEach(function (c) { if (!c.income) totals[c.key] += num(r[c.amtKey]); });
      });
      var out = 0, rows = '';
      CATS.forEach(function (c) {
        if (c.income) return; out += totals[c.key];
        rows += '<div class="sum-row"><span class="s-name"><span class="dot" style="background:' + c.color + '"></span>' + esc(c.name) + '</span>' +
          '<span class="s-val">' + money(totals[c.key]) + '</span></div>';
      });
      box.innerHTML =
        '<div class="sum-row"><span class="s-name"><span class="dot" style="background:var(--color-accent-800)"></span>ค่าเช่ารับเข้า (รวม)</span><span class="s-val">' + money(income) + '</span></div>' +
        rows +
        '<div class="sum-total"><span class="k">รวมจัดสรรออกทั้งหมด · ' + recs.length + ' เดือน</span><span class="v">' + money(out) + '</span></div>' +
        '<div class="sum-total" style="border-top:1px solid var(--color-divider)"><span class="k">คงเหลือสะสม</span><span class="v">' + (income - out < 0 ? '−' : '') + '฿' + Math.abs(Math.round(income - out)).toLocaleString('th-TH') + '</span></div>';
    }).catch(function (e) { box.innerHTML = '<div class="empty-note">โหลดไม่สำเร็จ: ' + esc(e.message) + '</div>'; });
  }
  function num(v) { if (!v) return 0; var n = parseFloat(String(v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; }

  /* ---------- panels / nav ---------- */
  function switchPanel(name) {
    if (!q('[data-panel="' + name + '"]')) return;
    qa('[data-panel]').forEach(function (p) { p.classList.toggle('hide', p.getAttribute('data-panel') !== name); });
    qa('[data-nav]').forEach(function (n) {
      if (n.getAttribute('data-nav') === name) n.setAttribute('aria-current', 'page'); else n.removeAttribute('aria-current');
    });
    try { if (location.hash.slice(1) !== name) history.replaceState(null, '', '#' + name); } catch (e) {}
    if (name === 'history') loadHistory();
    if (name === 'summary') loadSummary();
    window.scrollTo(0, 0);
  }

  /* ---------- toast / overlay ---------- */
  var tt;
  function toast(msg, isErr) { var t = q('[data-toast]'); if (!t) return; t.textContent = msg; t.className = 'toast' + (isErr ? ' err' : ''); t.setAttribute('data-show', '1'); clearTimeout(tt); tt = setTimeout(function () { t.removeAttribute('data-show'); }, 3200); }
  function overlay(on, text) { var o = q('[data-overlay]'); if (!o) return; if (text) setText('[data-overlay-text]', text); o.classList.toggle('hide', !on); }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var nav = up(e.target, '[data-nav]'); if (nav) { e.preventDefault(); switchPanel(nav.getAttribute('data-nav')); return; }
    var slip = up(e.target, '[data-open-slip]'); if (slip) { window.open(slip.getAttribute('data-open-slip'), '_blank'); return; }
    var rec = up(e.target, '[data-open-record]'); if (rec) { openRecord(rec.getAttribute('data-open-record')); return; }
    var sub = up(e.target, '[data-action="submit-record"]'); if (sub) { e.preventDefault(); submitRecord(); return; }
    var rst = up(e.target, '[data-action="reset-record"]'); if (rst) { e.preventDefault(); resetRecord(); return; }
    var rf = up(e.target, '[data-action="refresh"]'); if (rf) { loadDashboard(OFFSET); toast('รีเฟรชแล้ว'); return; }
    var mo = up(e.target, '[data-month]'); if (mo) {
      var dir = mo.getAttribute('data-month');
      if (dir === 'prev') { if (DASH && DASH.hasOlder) loadDashboard(OFFSET + 1); else toast('ไม่มีเดือนก่อนหน้าแล้ว'); }
      else { if (DASH && DASH.hasNewer) loadDashboard(OFFSET - 1); else toast('นี่คือเดือนล่าสุดแล้ว'); }
      return;
    }
  });

  document.addEventListener('change', function (e) {
    var inp = up(e.target, '[data-file-input]');
    if (inp && inp.files && inp.files[0]) {
      var f = inp.files[0];
      if (f.type && !/^image\//.test(f.type)) { toast('กรุณาเลือกไฟล์รูปภาพ', 1); inp.value = ''; return; }
      if (f.size > 15 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 15MB', 1); inp.value = ''; return; }
      var reader = new FileReader();
      reader.onload = function () {
        var dataUrl = reader.result;
        recordFile = { name: f.name, mimeType: f.type || guessMime(f.name), data: dataUrl.substring(dataUrl.indexOf(',') + 1) };
        var pv = q('[data-file-preview]'); if (pv) { pv.innerHTML = '<img src="' + dataUrl + '" alt="สลิป">'; pv.style.display = 'block'; }
        setText('[data-drop-name]', f.name);
      };
      reader.readAsDataURL(f);
      return;
    }
    var sel = up(e.target, '[data-cat-select]'); if (sel) updateDest();
  });

  /* ---------- init ---------- */
  window.addEventListener('DOMContentLoaded', function () {
    paintIcons(document);
    srun('getCategories').then(function (cats) {
      CATS = cats || []; CATMAP = {}; CATS.forEach(function (c) { CATMAP[c.key] = c; });
      buildCatSelect();
      loadDashboard(0);
      var h = location.hash.slice(1);
      if (h && q('[data-panel="' + h + '"]')) switchPanel(h);
    }).catch(function (e) { toast('เริ่มระบบไม่สำเร็จ: ' + e.message, 1); });
  });
})();
</script>
