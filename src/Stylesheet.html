<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Sans+Thai:wght@400;600&display=swap');

:root {
  --color-bg: #f3f2f2;
  --color-surface: #eae9e9;
  --color-text: #201e1d;
  --color-accent: #0088b0;
  --color-accent-2: #d6006c;
  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);

  --color-neutral-100: #f8f4f4;
  --color-neutral-200: #eae7e7;
  --color-neutral-300: #d7d3d3;
  --color-neutral-400: #bab6b6;
  --color-neutral-500: #9b9797;
  --color-neutral-600: #7d7979;
  --color-neutral-700: #605d5d;
  --color-neutral-800: #444141;
  --color-neutral-900: #2d2b2b;

  --color-accent-100: #e9f8ff; --color-accent-200: #cbeeff; --color-accent-300: #99e0ff;
  --color-accent-400: #62c5ee; --color-accent-500: #38a6cf; --color-accent-600: #1186ac;
  --color-accent-700: #006786; --color-accent-800: #004961; --color-accent-900: #0a303e;

  --color-accent-2-100: #fff1f4; --color-accent-2-200: #ffdee6; --color-accent-2-300: #ffc0d0;
  --color-accent-2-400: #ff90b1; --color-accent-2-500: #ff458e; --color-accent-2-600: #d82071;
  --color-accent-2-700: #aa0b56; --color-accent-2-800: #790e3d; --color-accent-2-900: #4b1528;

  /* ผสมเซริฟ (หัว/ตัวเลข) กับ Noto Sans Thai (เนื้อความไทยให้อ่านง่าย) */
  --font-heading: "Source Serif 4", "Noto Sans Thai", system-ui, serif;
  --font-body: "Noto Sans Thai", "Source Serif 4", system-ui, sans-serif;
  --font-num: "Source Serif 4", "Noto Sans Thai", system-ui, serif;

  --radius-sm: 1px; --radius-md: 2px; --radius-lg: 4px;
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body);
  font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
.ic { display: inline-flex; width: 1em; height: 1em; }
.ic svg { display: block; width: 100%; height: 100%; }
.hide { display: none !important; }
::selection { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* ---------------- masthead ---------------- */
.mast { position: sticky; top: 0; z-index: 20; background: var(--color-neutral-900); color: var(--color-neutral-100);
  display: flex; align-items: center; gap: 16px; padding: 16px 20px 12px; box-shadow: 0 1px 0 rgba(255,255,255,.06); }
.mast .iconbtn { color: var(--color-neutral-100); }
.mast .iconbtn:hover { background: rgba(255,255,255,.12); }
.brandmark { display: flex; align-items: baseline; gap: 9px; margin-right: auto; }
.brandmark .wm { font-family: var(--font-heading); font-weight: 600; font-size: 23px; letter-spacing: -.02em; line-height: 1; }
.brandmark .wm .dot-i { color: var(--color-accent); }
.brandmark .issue { font-size: 10.5px; font-style: italic; color: color-mix(in srgb, #ffffff 55%, transparent); letter-spacing: .02em; }
.topnav { display: none; }
.mast-right { display: flex; align-items: center; gap: 6px; }
.monthpick { display: inline-flex; align-items: center; gap: 4px; }
.monthpick .mlabel { font-family: var(--font-heading); font-weight: 600; font-size: 14px; min-width: 92px; text-align: center; }
.iconbtn { appearance: none; background: none; border: 1px solid transparent; cursor: pointer; color: var(--color-text);
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 999px; }
.iconbtn .ic { width: 20px; height: 20px; }
.iconbtn:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }

/* ---------------- screen ---------------- */
.screen { flex: 1; padding: 0 20px 108px; }
.dash { display: block; }
.empty-note { padding: 34px 0; text-align: center; font-style: italic; color: color-mix(in srgb, var(--color-text) 50%, transparent); }

.eyebrow { font-size: 10.5px; letter-spacing: .22em; text-transform: uppercase; font-weight: 600;
  color: color-mix(in srgb, var(--color-text) 52%, transparent); display: flex; align-items: center; gap: 9px; }
.eyebrow.accent { color: var(--color-accent-700); }
.eyebrow::before { content: ""; width: 16px; height: 1px; background: currentColor; opacity: .55; }

/* income lead */
.lead { padding: 26px 0 24px; border-bottom: 1px solid var(--color-divider); }
.lead .amount { font-family: var(--font-num); font-weight: 600; font-size: 54px; line-height: .92;
  letter-spacing: -.035em; font-variant-numeric: tabular-nums; margin: 14px 0 0; }
.lead .meta { font-size: 14px; margin-top: 14px; color: color-mix(in srgb, var(--color-text) 62%, transparent); }
.lead .meta .who { font-style: italic; color: var(--color-text); }
.received { display: inline-flex; align-items: center; gap: 5px; color: var(--color-accent-700); font-weight: 600; cursor: pointer; }
.received .ic { width: 15px; height: 15px; }
.received.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* allocation split */
.alloc { padding: 24px 0; border-bottom: 1px solid var(--color-divider); }
.alloc-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 13px; }
.alloc-h .pct { font-family: var(--font-num); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { display: flex; gap: 2px; height: 14px; }
.bar .seg { position: relative; min-width: 6px; border-radius: var(--radius-sm); overflow: hidden; transition: opacity .35s; }
.bar .seg.pending { opacity: .48; }
.bar .seg.pending::after { content: ""; position: absolute; inset: 0;
  background-image: repeating-linear-gradient(45deg, transparent 0 4px, color-mix(in srgb, var(--color-bg) 60%, transparent) 4px 8px); }
.bar .seg.leftover { background: transparent !important; border: 1px dashed var(--color-neutral-400); }
.figs { display: flex; margin-top: 20px; }
.figs .fig { flex: 1; padding: 0 16px; }
.figs .fig:first-child { padding-left: 0; }
.figs .fig + .fig { border-left: 1px solid var(--color-divider); }
.fig .k { font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.fig .v { font-family: var(--font-num); font-weight: 600; font-size: 22px; margin-top: 5px; font-variant-numeric: tabular-nums; line-height: 1; }
.fig.pending .v { color: var(--color-accent-700); }
.fig.leftover .v { color: var(--color-accent-2-700); }

/* alert */
.alert { display: flex; gap: 11px; align-items: flex-start; padding: 16px 0 4px; color: var(--color-accent-2-800); }
.alert .ic { width: 20px; height: 20px; flex: none; margin-top: 1px; color: var(--color-accent-2); }
.alert .a-body { font-size: 13.5px; line-height: 1.5; }
.alert b { font-weight: 600; }

/* ledger */
.ledger { padding-top: 8px; }
.ledger-h { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 2px; }
.ledger-h .hint { font-size: 12px; font-style: italic; color: color-mix(in srgb, var(--color-text) 52%, transparent); }
.entry { padding: 17px 0; border-bottom: 1px solid var(--color-divider); }
.entry .top { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.entry .e-name { font-family: var(--font-heading); font-weight: 600; font-size: 18px; line-height: 1.1; display: flex; align-items: center; gap: 9px; min-width: 0; }
.entry .e-name .dot { width: 9px; height: 9px; flex: none; border-radius: 2px; }
.entry .e-amt { font-family: var(--font-num); font-weight: 600; font-size: 19px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry .bottom { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 9px; padding-left: 18px; }
.entry .e-dest { font-size: 13px; color: color-mix(in srgb, var(--color-text) 58%, transparent); min-width: 0; }
.entry .e-dest .to { color: var(--color-accent-700); font-weight: 600; }
.entry .e-side { display: flex; align-items: center; gap: 14px; flex: none; }

.stat { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; letter-spacing: .02em; white-space: nowrap; }
.stat .ic { width: 14px; height: 14px; }
.stat.paid { color: color-mix(in srgb, var(--color-text) 50%, transparent); }
.stat.slip, .stat.transfer { color: var(--color-accent-700); }
.stat.overdue { color: var(--color-accent-2-700); font-weight: 600; }

.act { appearance: none; cursor: pointer; font-family: var(--font-heading); font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; }
.act .ic { width: 15px; height: 15px; }
.act.primary { background: var(--color-accent); color: var(--color-bg); }
.act.primary:hover { background: var(--color-accent-600); }
.act.danger { background: var(--color-accent-2); color: var(--color-bg); }
.act.danger:hover { background: var(--color-accent-2-600); }
.act.outline { border-color: var(--color-divider); color: var(--color-text); }
.act.outline:hover { border-color: var(--color-accent); color: var(--color-accent-700); }
.act.link { background: none; padding: 9px 4px; color: var(--color-accent-700); }
.act.link:hover { text-decoration: underline; text-underline-offset: 3px; }

/* record form */
.record, .hist, .sum { max-width: 620px; padding-top: 24px; }
.rec-title { font-family: var(--font-heading); font-weight: 600; font-size: 32px; letter-spacing: -.025em; margin: 12px 0 0; line-height: 1; }
.rec-sub { font-size: 14px; font-style: italic; color: color-mix(in srgb, var(--color-text) 58%, transparent); margin: 11px 0 0; line-height: 1.5; }
.record .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin: 22px 0; }
.record .grid .full { grid-column: 1 / -1; }
.field > label { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 7px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
.finput { width: 100%; font: inherit; font-size: 15px; color: var(--color-text); background: transparent; padding: 10px 0;
  border: 0; border-bottom: 1px solid var(--color-neutral-400); border-radius: 0; }
.finput:focus { outline: none; border-bottom-color: var(--color-accent); }
select.finput { appearance: none; -webkit-appearance: none; cursor: pointer; }
.dest-note { font-size: 13px; margin-top: 9px; color: var(--color-accent-700); font-style: italic; }
.drop { display: flex; align-items: center; gap: 15px; padding: 18px 0; border-top: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider); cursor: pointer; }
.drop .dic { width: 44px; height: 44px; flex: none; display: grid; place-items: center; color: var(--color-accent); }
.drop .dic .ic { width: 28px; height: 28px; }
.drop .d-t { font-family: var(--font-heading); font-weight: 600; font-size: 16px; }
.drop .d-s { font-size: 12.5px; color: color-mix(in srgb, var(--color-text) 55%, transparent); font-style: italic; margin-top: 2px; }
.drop:hover .d-t { color: var(--color-accent-700); }
.file-input { display: none; }
.preview { margin: 16px 0 0; display: none; max-width: 240px; }
.preview img { width: 100%; display: block; filter: grayscale(.35) contrast(1.15); border: 1px solid var(--color-divider); }
.form-actions { display: flex; gap: 20px; align-items: center; margin-top: 26px; }
.btn-primary-lg { appearance: none; cursor: pointer; font-family: var(--font-heading); font-weight: 600; font-size: 15px;
  background: var(--color-accent); color: var(--color-bg); border: 0; padding: 13px 28px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary-lg:hover { background: var(--color-accent-600); }
.btn-primary-lg:disabled { opacity: .5; cursor: default; }
.btn-text { background: none; border: 0; cursor: pointer; font: inherit; font-size: 14px; color: color-mix(in srgb, var(--color-text) 60%, transparent); }
.btn-text:hover { color: var(--color-text); }

/* history / summary */
.hist [data-history], .sum [data-summary] { margin-top: 20px; }
.sum-row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 15px 0; border-bottom: 1px solid var(--color-divider); }
.sum-row .s-name { font-family: var(--font-heading); font-weight: 600; font-size: 16.5px; display: flex; align-items: center; gap: 9px; }
.sum-row .s-name .dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.sum-row .s-val { font-family: var(--font-num); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.sum-total { display: flex; align-items: baseline; justify-content: space-between; padding: 18px 0 6px; margin-top: 4px; border-top: 2px solid var(--color-text); }
.sum-total .k { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.sum-total .v { font-family: var(--font-num); font-weight: 600; font-size: 24px; font-variant-numeric: tabular-nums; }
.hist-month { padding: 16px 0; border-bottom: 1px solid var(--color-divider); }
.hist-month .hm-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.hist-month .hm-title { font-family: var(--font-heading); font-weight: 600; font-size: 17px; }
.hist-month .hm-income { font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--color-accent-700); }
.hist-month .hm-lines { margin-top: 8px; padding-left: 2px; display: flex; flex-direction: column; gap: 4px; }
.hist-month .hm-line { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: color-mix(in srgb, var(--color-text) 62%, transparent); }
.hist-month .hm-line .v { font-variant-numeric: tabular-nums; color: var(--color-text); }
.hist-month .hm-line a { color: var(--color-accent-700); font-weight: 600; text-decoration: none; }

/* bottom tab bar (mobile) */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; background: color-mix(in srgb, var(--color-bg) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); border-top: 1px solid var(--color-divider); padding: 7px 6px 9px; }
.tb { flex: 1; background: none; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 5px 0; color: color-mix(in srgb, var(--color-text) 50%, transparent); font-family: var(--font-body); font-size: 10.5px; letter-spacing: .01em; }
.tb .ic { width: 22px; height: 22px; }
.tb[aria-current="page"] { color: var(--color-accent-700); }
.tb.mid .ic { width: 26px; height: 26px; }

/* toast + overlay */
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%) translateY(14px); opacity: 0; pointer-events: none;
  transition: .25s ease; background: var(--color-neutral-900); color: var(--color-neutral-100); padding: 12px 18px;
  border-radius: var(--radius-md); font-size: 13.5px; box-shadow: var(--shadow-lg); max-width: 84%; z-index: 60; text-align: center; }
.toast[data-show] { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.err { background: var(--color-accent-2-800); }
.overlay { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  background: color-mix(in srgb, var(--color-bg) 78%, transparent); }
.overlay p { font-family: var(--font-heading); font-weight: 600; font-size: 14px; }
.spin { width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--color-neutral-300); border-top-color: var(--color-accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================= DESKTOP ================= */
@media (min-width: 900px) {
  .app { max-width: 1180px; margin: 0 auto; }
  .mast { padding: 22px 44px 16px; gap: 32px; background: var(--color-bg); color: var(--color-text); border-bottom: 2px solid var(--color-text); box-shadow: 0 3px 0 -2px var(--color-divider); }
  .mast .iconbtn { color: var(--color-text); }
  .mast .iconbtn:hover { background: color-mix(in srgb, var(--color-text) 6%, transparent); }
  .brandmark .wm { font-size: 25px; }
  .brandmark .issue { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
  .topnav { display: flex; align-items: center; gap: 30px; }
  .topnav .tab { appearance: none; background: none; border: 0; cursor: pointer; font-family: var(--font-body); font-size: 14.5px;
    color: color-mix(in srgb, var(--color-text) 62%, transparent); padding: 4px 0; position: relative; display: inline-flex; align-items: center; gap: 8px; }
  .topnav .tab .ic { width: 17px; height: 17px; }
  .topnav .tab:hover { color: var(--color-text); }
  .topnav .tab[aria-current="page"] { color: var(--color-text); }
  .topnav .tab[aria-current="page"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -17px; height: 2px; background: var(--color-accent); }
  .screen { padding: 8px 44px 64px; }
  .dash { display: grid; grid-template-columns: minmax(360px, 430px) 1fr; gap: 64px; align-items: start; }
  .col-summary { position: sticky; top: 104px; }
  .lead { padding-top: 30px; }
  .lead .amount { font-size: 66px; }
  .ledger { padding-top: 30px; }
  .entry .e-name { font-size: 20px; }
  .tabbar { display: none; }
  .toast { bottom: 34px; }
  .record, .hist, .sum { padding-top: 34px; }
  .desk-only { display: inline-flex; }
}
@media (max-width: 899px) { .desk-only { display: none; } }
</style>
